# A complete SunSprout hub device with the cell settings and the guided first-time setup, built from the firmware packages, with your own
# WiFi and API key (so no setup mode: that is what devices/factory.yaml adds on top of these same packages).
#
# Copy this, change the substitutions and the secrets, and flash it. The pieces:
#
#   modules/hub.yaml         the hardware: charger, fuel gauge, buses, LED, user rail
#   modules/common.yaml      logging and diagnostics every device wants
#   modules/setup.yaml       the Cell Chemistry, capacity, energy, charge voltage, charge current and thermistor settings, the guided
#                            first-time setup the SunSprout Monitor integration runs, and the recorded setup state
#   modules/wizard.yaml      optional setup wizard pages for Home Assistant 2026.11 and later
#   modules/deep-sleep.yaml  optional deep sleep (remove the line to stay awake)
#
# Everything below is the part you write for any ESPHome device. To ship an image
# that asks the end user for WiFi instead, see devices/factory.yaml.
#
# examples/example-device.yaml is the same device without the setup: the cell is then fixed by the substitutions below.

substitutions:
  name: sunsprout
  friendly_name: Sunsprout

  # With the setup package the cell is chosen after the first flash (from Home Assistant or the guided setup), and
  # kept in flash. These are what the FIRST boot uses, so set them for your pack and the first boot already matches it.
  # These are the LiFePO4 defaults; README.md lists the values for a standard lithium-ion cell.
  battery_capacity: "6000"
  battery_energy_mwh: "19200"
  # Per cell, in volts: the chemistry's standard is 3.65 V for LiFePO4 and 4.2 V for Li-ion. A cell whose data sheet gives a LOWER
  # limit (3.60 V, say) can use it; it can never be set higher than the standard.
  cell_charge_voltage: "3.65"

packages:
  hub: !include ../modules/hub.yaml
  common: !include ../modules/common.yaml
  # The cell settings and the guided first-time setup.
  setup: !include ../modules/setup.yaml
  # Optional: a setup wizard that Home Assistant 2026.11 and later shows when the device is added.
  wizard: !include ../modules/wizard.yaml
  deep_sleep: !include ../modules/deep-sleep.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: JohnNeville.SunSproutHub
    version: DIY
    sbom:
      supplier: "John Neville"
      url: "https://github.com/JohnNeville/SunSprout-firmware/security/policy"

# The first-boot option of the chemistry and thermistor selects (they are not substitutions). Uncomment and change for a
# lithium-ion pack or a pack with no thermistors; the setup records the same values afterwards.
# select:
#   - id: !extend cell_chemistry
#     initial_option: "Li-ion"
#   - id: !extend ts_enable
#     initial_option: "None"

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_password

captive_portal:
