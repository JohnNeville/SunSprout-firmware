# A hub with two satellites: examples/example-device.yaml plus one modules/satellite.yaml per satellite.
#
# Satellite 2 has its address jumpers changed (ADS1115 0x49, ADDR tied to 3V3; DS2482 0x1A) so both can share
# the bus. 0x49 also stays clear of 0x4A, the default address of the DFRobot SEN0390 light sensor.
# Replace the two voltages below with the readings of your own probes in air and in water.

substitutions:
  soil_dry_voltage: "2.43"
  soil_wet_voltage: "1.12"

packages:
  device: !include example-device.yaml
  sat1: !include
    file: ../modules/satellite.yaml
    vars:
      id: sat1
      name: "Satellite 1"
      ads_address: 0x48
      ds_address: 0x18
  sat2: !include
    file: ../modules/satellite.yaml
    vars:
      id: sat2
      name: "Satellite 2"
      ads_address: 0x49
      ds_address: 0x1A
