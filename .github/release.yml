# Groups the generated release notes. A pull request lands in the first category whose label it
# carries; unlabelled ones go under "Other changes".
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Firmware changes
      labels: [firmware, enhancement]
    - title: Fixes
      labels: [bug, fix]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
