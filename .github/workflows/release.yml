# Releases the firmware whenever a change to a firmware file lands on main. It commits nothing.
#
# The version is YYYY.MM.DD.N, the UTC date plus this workflow's run number, so it needs no
# counting of earlier tags and cannot collide. It is passed to the compile as the
# `firmware_version` substitution, which sets `project.version`: each attached factory image
# reports it (Home Assistant shows it as the device's software version). The release tag is
# created by GitHub at the merge commit. A board built from `@main`, for example in the ESPHome
# dashboard, has no version passed in and reports "dev".
#
# Release notes are GitHub's generated notes from the merged pull requests since the last
# release, grouped by label as configured in .github/release.yml.
#
# Changes that touch only docs or workflows do not release.

name: Release

on:
  push:
    branches: [main]
    paths:
      - "*.yaml"
      - "modules/**"
      - "devices/**"
      - "examples/**"

permissions:
  contents: read

# One release at a time, and never cancel one half way through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Version, tag and release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Work out the version
        id: version
        run: |
          version="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run of a failed job reuses the same run number, so the release may exist already.
          gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

  build:
    name: Build and attach the factory images
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/build-factory-firmware.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
