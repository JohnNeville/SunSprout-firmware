# Validates the ESPHome configuration whenever it changes.
#
# Only `esphome config` runs here, not `esphome compile`. The chip drivers live in
# JohnNeville/esphome-bq-drivers and are compiled by that repository's own CI, which is
# where a C++ error would surface. What this job checks is that the board package and the
# example devices still describe a valid configuration against the current driver schemas
# and the current ESPHome release -- which is exactly what breaks when either moves.

name: Validate firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The drivers and ESPHome move independently of this repository, so check weekly too.
    - cron: "17 5 * * 1"

jobs:
  validate:
    name: esphome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        # ESPHome 2026.11 added a required `relation` on sub-devices, which the satellite packages
        # use. Until 2026.11 is released, build against the development branch; then change this
        # back to `pip install esphome`.
        run: pip install "git+https://github.com/esphome/esphome.git@dev"

      - name: Write placeholder secrets
        # The example config reads secrets that obviously are not in the repo.
        # `esphome config` only needs the keys to resolve, not to be real. The API key is
        # generated fresh on every run, so no key is ever stored in the repository, and it
        # needs no repository secret (which fork and Dependabot runs would not receive).
        run: |
          # ESPHome reads secrets.yaml from the directory of the file it is given.
          for dir in . examples; do
            cat > "$dir/secrets.yaml" <<EOF
          wifi_ssid: "placeholder"
          wifi_password: "placeholder"
          fallback_password: "placeholder"
          api_encryption_key: "$(openssl rand -base64 32)"
          EOF
          done

      - name: Validate the examples
        run: |
          esphome config examples/example-device.yaml
          esphome config examples/example-satellites.yaml

      - name: Validate the devices
        run: |
          esphome config devices/factory.yaml
          esphome config devices/factory-satellites.yaml
          esphome config devices/factory-debug.yaml
          esphome config devices/factory-satellites-debug.yaml

      - name: Validate the old-path stubs
        # Devices already adopted in the dashboard pull the factory image in from its old path.
        run: esphome config sunsprout-factory.yaml

      - name: Validate a standard lithium-ion build
        # The substitutions documented in README.md must keep building.
        run: |
          # -s is a top-level option: after the subcommand it is silently ignored.
          esphome \
            -s cell_chemistry li_ion \
            -s battery_capacity 3000 \
            -s battery_energy_mwh 11100 \
            -s lifepo4_relax false \
            config examples/example-device.yaml
