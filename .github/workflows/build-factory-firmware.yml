# Builds the factory images and keeps them as downloadable artifacts.
#
# `Validate firmware` only checks that the configurations are valid. This workflow goes
# further: it compiles every image in devices/, the images a board is flashed with, so each
# build gives binaries to flash and walk through the setup flow (Improv over USB, the
# "Sunsprout Setup" access point, or adopting it in the ESPHome dashboard):
#
#   factory                    the hub on its own
#   factory-satellites         the hub with two satellites, I2C addresses chosen in Home Assistant
#   factory-debug              the hub plus bench diagnostics (an I2C scan button and more)
#   factory-satellites-debug   the satellites image plus the same diagnostics
#
# Download an artifact from the run's Summary page (kept for 30 days). Each holds:
#   - sunsprout-<image>-<label>.factory.bin: the full image. Write it at offset 0x0 over USB,
#     for example `esptool.py --chip esp32c5 write_flash 0x0 <file>`.
#   - sunsprout-<image>-<label>.ota.bin: the app only, for updating a board that is already
#     running ESPHome.
#   - SHA256SUMS
# <label> is the short commit hash, or the tag name for a release.
#
# A release gets every image's files attached, plus one SHA256SUMS for all of them, so a released
# build stays downloadable after the artifacts have expired. The debug images are for bench work.

name: Build factory firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
  # Called by release.yml, which has to build the images itself: a release created with the
  # default token does not trigger the `release` event above.
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the files to
        type: string
        required: false
        default: ""
      version:
        description: Firmware version to build in (YYYY.MM.DD.N); empty builds "dev"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-factory-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - factory
          - factory-satellites
          - factory-debug
          - factory-satellites-debug
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        # ESPHome 2026.11 added a required `relation` on sub-devices, which the satellite packages
        # use. Until 2026.11 is released, build against the development branch; then change this
        # back to `pip install esphome`.
        run: pip install "git+https://github.com/esphome/esphome.git@dev"

      - name: Compile
        env:
          VERSION: ${{ inputs.version }}
        run: esphome ${VERSION:+-s firmware_version "$VERSION"} compile devices/${{ matrix.image }}.yaml

      - name: Collect the binaries
        id: bins
        env:
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ matrix.image }}
        run: |
          short="${GITHUB_SHA::7}"
          label="$short"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then label="$GITHUB_REF_NAME"; fi
          if [ -n "$TAG" ]; then label="$TAG"; fi
          out="dist"
          mkdir -p "$out"
          factory="$(find devices/.esphome/build -name firmware.factory.bin | head -n 1)"
          ota="$(find devices/.esphome/build -name firmware.ota.bin | head -n 1)"
          test -n "$factory" && test -n "$ota"
          cp "$factory" "$out/sunsprout-$IMAGE-$label.factory.bin"
          cp "$ota" "$out/sunsprout-$IMAGE-$label.ota.bin"
          (cd "$out" && sha256sum * > SHA256SUMS)
          ls -l "$out"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunsprout-${{ matrix.image }}-${{ steps.bins.outputs.short }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to the release
    needs: build
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download every image
        uses: actions/download-artifact@v4
        with:
          pattern: sunsprout-*-*
          merge-multiple: false
          path: images

      - name: Gather the files and one checksum list
        run: |
          mkdir dist
          find images -type f ! -name SHA256SUMS -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "${TAG:-$GITHUB_REF_NAME}" dist/* --repo "$GITHUB_REPOSITORY" --clobber
