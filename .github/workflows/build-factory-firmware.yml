# Builds the factory image and keeps it as a downloadable artifact.
#
# `Validate firmware` only checks that the configurations are valid. This workflow goes
# further: it compiles sunsprout-factory.yaml, the image a new board is flashed with, so
# every build gives a binary to flash and walk through the setup flow (Improv over USB,
# the "Sunsprout Setup" access point, or adopting it in the ESPHome dashboard).
#
# Download the artifact from the run's Summary page (kept for 30 days). It holds:
#   - sunsprout-factory-<label>.factory.bin: the full image. Write it at offset 0x0 over USB,
#     for example `esptool.py --chip esp32c5 write_flash 0x0 <file>`.
#   - sunsprout-factory-<label>.ota.bin: the app only, for updating a board that is already
#     running ESPHome.
#   - SHA256SUMS
# <label> is the short commit hash, or the tag name for a release.
#
# Publishing a release also runs this workflow and attaches the same files to the release,
# so a released build stays downloadable after the artifact has expired.

name: Build factory firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
  # Called by release.yml, which has to build the image itself: a release created with the
  # default token does not trigger the `release` event above.
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the files to
        type: string
        required: false
        default: ""
      version:
        description: Firmware version to build in (YYYY.MM.DD.N); empty builds "dev"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-factory-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile the factory image
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.bins.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Write placeholder secrets
        # The factory image reads no secrets, but the shared packages are validated the same
        # way as in `Validate firmware`, so keep the file the same shape.
        run: |
          cat > secrets.yaml <<EOF
          wifi_ssid: "placeholder"
          wifi_password: "placeholder"
          fallback_password: "placeholder"
          api_encryption_key: "$(openssl rand -base64 32)"
          EOF

      - name: Compile
        env:
          VERSION: ${{ inputs.version }}
        run: esphome ${VERSION:+-s firmware_version "$VERSION"} compile sunsprout-factory.yaml

      - name: Collect the binaries
        id: bins
        env:
          TAG: ${{ inputs.tag }}
        run: |
          short="${GITHUB_SHA::7}"
          label="$short"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then label="$GITHUB_REF_NAME"; fi
          if [ -n "$TAG" ]; then label="$TAG"; fi
          out="dist"
          mkdir -p "$out"
          factory="$(find .esphome/build -name firmware.factory.bin | head -n 1)"
          ota="$(find .esphome/build -name firmware.ota.bin | head -n 1)"
          test -n "$factory" && test -n "$ota"
          cp "$factory" "$out/sunsprout-factory-$label.factory.bin"
          cp "$ota" "$out/sunsprout-factory-$label.ota.bin"
          (cd "$out" && sha256sum * > SHA256SUMS)
          ls -l "$out"
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunsprout-factory-${{ steps.bins.outputs.short }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to the release
    needs: build
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sunsprout-factory-${{ needs.build.outputs.short }}
          path: dist

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "${TAG:-$GITHUB_REF_NAME}" dist/* --repo "$GITHUB_REPOSITORY" --clobber
