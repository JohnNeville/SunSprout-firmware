# Factory image: a SunSprout hub that carries no WiFi credentials.
#
# Flash this once and the board comes up in setup mode. The end user then gives it
# a network in any of four ways:
#
#   - from a browser over USB, through the Improv prompt on the ESP Web Tools page;
#   - from a phone over Bluetooth, with any Improv Bluetooth client: connect, then press
#     the BOOT button (SW2) within a minute to authorise the change;
#   - by joining the "Sunsprout Setup" access point and using the captive portal;
#   - by adopting it in the ESPHome dashboard, which writes a normal device file that
#     pulls this one in as a package and adds the secrets (see dashboard_import below).
#
# Setup stays open for five minutes after power-up. If nobody has provisioned the board
# by then the access point, the portal and both Improv transports close, and the status
# LED flashes fast. Cycle the power to open the window again.
#
# The status LED is ESPHome's own status_led: it pulses slowly while a component has a
# warning (the WiFi connecting, or no client such as Home Assistant connected yet), flashes
# fast on an error (the timeout above, a failed component) and is off the rest of the time. It is plain output state, so nothing is saved and nothing comes back at the
# next power-up. This image therefore has no "Status LED" light entity.
#
# Holding the BOOT button for ten seconds erases the saved settings, including any WiFi
# credentials given through Improv or the portal, and restarts the board in setup mode.
# The LED blinks fast for a second and a half before the restart.
#
# The cell is set after setup, not at build time: the Cell Chemistry, Battery Capacity,
# Battery Energy, Default Charge Current and TS Enable entities (configuration category) are kept in
# flash and written to the charger and the fuel gauge at every boot. Until they are changed
# the board assumes a 6000 mAh LiFePO4 cell, which charges to 3.65 V and cannot overcharge
# a lithium-ion cell either. Choosing Li-ion raises the limit to 4.2 V. The charger also
# expects a thermistor on the TS pin and will not charge without one; TS Enable says which of
# the two thermistors (charger J302, gauge J401) are fitted, and a pack with none can charge at
# the cost of the temperature protection.
#
# It carries no API encryption key and no OTA password, because those belong to whoever
# owns the board: Home Assistant sets the key on first connection, or adopting it in the
# dashboard generates one. It does not include deep sleep, so an
# unconfigured board stays awake long enough to be set up.

substitutions:
  name: sunsprout
  friendly_name: Sunsprout

  # Set by the release workflow (`esphome -s firmware_version ...`) to YYYY.MM.DD.<build>. A build
  # made any other way, such as from the ESPHome dashboard, reports "dev".
  firmware_version: "dev"

  # The LiFePO4 defaults. A standard lithium-ion build changes these; see README.md.
  battery_capacity: "6000"
  battery_energy_mwh: "19200"

  # Version of the first-time setup. Bump it whenever a new item is added to the setup (a new value in the Setup Status key
  # or a new argument of setup_battery): a board whose stored setup is older then reports "outdated".
  setup_schema: "1"

packages:
  hub: !include ../modules/hub.yaml
  common: !include ../modules/common.yaml
  # Home Assistant 2026.11 and later shows this setup wizard when the board is added; older versions ignore it.
  wizard: !include ../modules/wizard.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  on_boot:
    # After the charger and gauge have set themselves up and the entities above have been restored.
    - priority: 100
      then:
        - globals.set:
            id: battery_ready
            value: "true"
        - script.execute: apply_battery
    # A board with no battery attached leaves the fuel gauge unpowered, so it never answers and
    # ESPHome marks it failed. A failed component raises the error flag, which makes the status
    # LED flash fast for good. A missing battery is a normal state for a factory image, so drop
    # that flag (the error stays in the log) and leave the LED to the provisioning signal.
    - priority: -200
      then:
        - lambda: |-
            if (id(fuel_gauge).is_failed()) {
              id(fuel_gauge).status_clear_error();
            }
  project:
    name: JohnNeville.SunSproutHub
    version: ${firmware_version}

dashboard_import:
  package_import_url: github://JohnNeville/SunSprout-firmware/sunsprout-factory.yaml@main
  import_full_config: false

# Encryption is on but has no key. The board starts without one and the first client to
# connect, normally Home Assistant, sets a random key over an encrypted channel; the board
# keeps it in flash. The key is only accepted while the five-minute setup window is open, so the
# client has to connect within that time of power-up. Until a key is set the API counts as
# unprovisioned, so a board that has WiFi but has never met Home Assistant will still reach the
# timeout above. A board adopted in the ESPHome dashboard gets a key from the dashboard instead.
api:
  encryption:
  # First-time setup, called by the SunSprout Monitor integration (Home Assistant exposes these as esphome.<device>_<action>).
  # setup_battery writes the same persisted entities as the Cell Chemistry, Battery Capacity, Battery Energy, Default Charge
  # Current and TS Enable settings, so changes made by hand in Home Assistant work as before. It never turns charging on.
  actions:
    - action: get_setup_info
      description: "Read only: the cell settings, the fuel gauge chemistry ID and whether the first-time setup was completed."
      supports_response: only
      then:
        - component.update: setup_key
        - component.update: setup_status
        - api.respond:
            data: !lambda |-
              root["setup_state"] = id(setup_status).has_state() ? id(setup_status).state : std::string("unknown");
              root["setup_schema"] = ${setup_schema};
              root["stored_schema"] = id(setup_schema_stored);
              root["firmware_version"] = "${firmware_version}";
              root["chemistry"] = std::string(id(cell_chemistry).current_option().c_str());
              root["capacity_mah"] = (int) id(battery_capacity_mah).state;
              root["energy_mwh"] = (int) id(battery_energy_mwh).state;
              root["charge_current_ma"] = (int) id(default_charge_current).state;
              root["thermistors"] = std::string(id(ts_enable).current_option().c_str());
              root["charging_enabled"] = id(enable_charging).state;
              const float chem = id(gauge_chem_id).state;
              if (!std::isnan(chem)) root["gauge_chemistry_id"] = (int) chem;

    - action: scan_i2c
      description: "Read only: probes the addresses a satellite's two chips can use on the user I2C bus (ADS1115 0x48 to 0x4B, DS2482 0x18 to 0x1B) and lists the ones that answer. A chip answering at an address does not say which chip it is. Changes nothing."
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              std::string found;
              auto probe = [&](uint8_t from, uint8_t to) {
                for (uint8_t a = from; a <= to; a++) {
                  if (id(bus_user)->write_readv(a, nullptr, 0, nullptr, 0) == i2c::ERROR_OK) {
                    char b[8];
                    snprintf(b, sizeof(b), "0x%02X", a);
                    if (!found.empty()) found += ",";
                    found += b;
                  }
                }
              };
              probe(0x18, 0x1B);
              probe(0x48, 0x4B);
              root["found"] = found;
              // The satellites are powered from the user 3V3 rail; with it off nothing answers.
              root["rail_on"] = id(user_rail).state;

    - action: setup_battery
      description: "Set the cell chemistry, capacity, energy, default charge current and thermistors, apply them to the charger and the fuel gauge, read them back and, if they match, record the setup as complete. Charging is not turned on."
      variables:
        chemistry: string
        capacity_mah: int
        energy_mwh: int
        charge_current_ma: int
        thermistors: string
      supports_response: optional
      then:
        - lambda: |-
            std::string e;
            if (!id(battery_ready)) e = "The board is still starting; try again in a few seconds.";
            else if (chemistry != "LiFePO4" && chemistry != "Li-ion") e = "chemistry must be LiFePO4 or Li-ion.";
            else if (capacity_mah < 100 || capacity_mah > 20000) e = "capacity_mah must be 100 to 20000.";
            else if (energy_mwh != 0 && (energy_mwh < 100 || energy_mwh > 32767)) e = "energy_mwh must be 0 (automatic) or 100 to 32767.";
            else if (charge_current_ma < 100 || charge_current_ma > 2000) e = "charge_current_ma must be 100 to 2000.";
            else if (thermistors != "Both" && thermistors != "Charger Only" && thermistors != "Gauge Only" && thermistors != "None")
              e = "thermistors must be Both, Charger Only, Gauge Only or None.";
            id(setup_error) = e;
        - if:
            condition:
              lambda: 'return !id(setup_error).empty();'
            then:
              - api.respond:
                  success: false
                  error_message: !lambda 'return id(setup_error);'
            else:
              - select.set:
                  id: cell_chemistry
                  option: !lambda 'return chemistry;'
              - number.set:
                  id: battery_capacity_mah
                  value: !lambda 'return capacity_mah;'
              # 0 means "work it out": the same capacity x nominal cell voltage as fill_energy, set explicitly so a
              # redo with an unchanged capacity and chemistry does not keep an old hand-edited value.
              - number.set:
                  id: battery_energy_mwh
                  value: !lambda |-
                    if (energy_mwh > 0) return (float) energy_mwh;
                    return std::min(32767.0f, std::round(capacity_mah * (chemistry == "LiFePO4" ? 3.2f : 3.7f)));
              - number.set:
                  id: default_charge_current
                  value: !lambda 'return charge_current_ma;'
              - select.set:
                  id: ts_enable
                  option: !lambda 'return thermistors;'
              # Each change above restarts apply_battery; wait for the last run to finish writing the charger and gauge.
              - delay: 200ms
              - script.wait: apply_battery
              - component.update: setup_key
              - lambda: |-
                  std::string e;
                  if (std::string(id(cell_chemistry).current_option().c_str()) != chemistry) e = "chemistry did not read back.";
                  else if ((int) id(battery_capacity_mah).state != capacity_mah) e = "capacity did not read back.";
                  else if (std::lround(id(battery_energy_mwh).state) !=
                           (energy_mwh > 0 ? (long) energy_mwh
                                           : std::min(32767L, std::lround(capacity_mah * (chemistry == "LiFePO4" ? 3.2f : 3.7f)))))
                    e = "energy did not read back.";
                  else if ((int) id(default_charge_current).state != charge_current_ma) e = "charge current did not read back.";
                  else if (std::string(id(ts_enable).current_option().c_str()) != thermistors) e = "thermistors did not read back.";
                  else if (!id(setup_key).has_state()) e = "setup key not ready.";
                  id(setup_error) = e;
                  if (e.empty()) {
                    uint32_t h = (uint32_t) strtoul(id(setup_key).state.c_str(), nullptr, 16);
                    id(setup_hash_stored) = h == 0 ? 1 : h;
                    id(setup_schema_stored) = ${setup_schema};
                  }
              - component.update: setup_status
              - api.respond:
                  success: !lambda 'return id(setup_error).empty();'
                  error_message: !lambda 'return id(setup_error);'
                  data: !lambda |-
                    root["setup_state"] = id(setup_status).has_state() ? id(setup_status).state : std::string("unknown");
                    root["chemistry"] = std::string(id(cell_chemistry).current_option().c_str());
                    root["capacity_mah"] = (int) id(battery_capacity_mah).state;
                    root["energy_mwh"] = (int) id(battery_energy_mwh).state;
                    root["charge_current_ma"] = (int) id(default_charge_current).state;
                    root["thermistors"] = std::string(id(ts_enable).current_option().c_str());
                    root["charging_enabled"] = id(enable_charging).state;

ota:
  - platform: esphome

# ESPHome batches flash writes and by default flushes them once a minute, so a cell setting
# changed and then followed by a reset or an unplug inside that minute would be lost. Nothing
# here writes often (only when a setting changes), so flush quickly.
preferences:
  flash_write_interval: 5s

# No ssid: the board starts its own access point until credentials are saved.
wifi:
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

improv_serial:

# Bluetooth setup for phones. The BOOT button authorises a change, so a stranger in
# range cannot set the network while the window is open.
esp32_ble:

improv_ble:
  authorizer: boot_button
  authorized_duration: 1min

# The window is counted from power-up and only runs while the board has no network. When
# it expires the transports above close; the LED is the only sign left. The warning below
# lives in RAM, so a power cycle clears it along with reopening the window.
provisioning:
  id: provisioning_window
  timeout: 5min
  on_timeout:
    then:
      - logger.log:
          level: WARN
          format: "Provisioning window timed out. Cycle the power to try again."
      # An error, not a warning: a slow pulse already means "online, waiting for a client".
      - lambda: 'id(provisioning_window).status_set_error();'

# GPIO6 drives the LED through R3. The hub package puts a "Status LED" light on the same pin;
# this image gives the pin to ESPHome's status LED instead.
status_led:
  pin: GPIO6

output:
  - id: !remove status_led_output

light:
  - id: !remove status_led

# SW2 pulls GPIO28 low and has a 10 kOhm pull-up on the board. GPIO28 is a boot-mode
# strapping pin, which only matters at reset: holding the button during power-up still
# enters the download mode, as it always has.
binary_sensor:
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO28
      mode:
        input: true
      inverted: true
      ignore_strapping_warning: true
    on_press:
      then:
        - script.execute: hold_to_reset
    on_release:
      then:
        - script.stop: hold_to_reset

globals:
  - id: battery_ready
    type: bool
    initial_value: "false"

  # The recorded first-time setup. These survive reboots and OTA updates (and removing the Home Assistant integration); a
  # factory reset erases them with the other saved settings. setup_hash_stored is 0 until a setup has completed.
  - id: setup_schema_stored
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: setup_hash_stored
    type: uint32_t
    restore_value: true
    initial_value: "0"
  # Scratch: the reason a setup_battery call was refused or did not read back.
  - id: setup_error
    type: std::string
    initial_value: '""'

script:
  - id: hold_to_reset
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            binary_sensor.is_on: boot_button
          then:
            - logger.log:
                level: WARN
                format: "BOOT held for 10 s: erasing the saved settings."
            - lambda: 'id(provisioning_window).status_set_error();'
            - delay: 1500ms
            - button.press: factory_reset_button

  # Only after boot: the entities publish their restored values while the board is starting,
  # and recomputing then would overwrite an energy value the owner had edited.
  - id: fill_energy
    then:
      - if:
          condition:
            lambda: 'return id(battery_ready);'
          then:
            - lambda: |-
                const bool lifepo4 = id(cell_chemistry).active_index().value_or(0) == 0;
                float mwh = id(battery_capacity_mah).state * (lifepo4 ? 3.2f : 3.7f);
                if (mwh > 32767.0f) mwh = 32767.0f;
                id(battery_energy_mwh).make_call().set_value(mwh).perform();

  # Writes the four values to the charger (charge voltage limit, termination current, charge
  # current) and the gauge (design capacity and energy, LFPRelax). The gauge compares each
  # value with its data flash first and only writes what differs, so running this at every
  # boot does not wear it.
  - id: apply_battery
    mode: restart
    then:
      # The entities above publish their restored values while the board is still starting,
      # before the charger and gauge are ready. The boot step sets this flag and applies once.
      - if:
          condition:
            lambda: 'return id(battery_ready);'
          then:
            - script.execute: write_battery

  - id: write_battery
    then:
      - bq25798.configure_battery:
          id: charger
          chemistry: !lambda |-
            return id(cell_chemistry).active_index().value_or(0) == 1 ? std::string("li_ion") : std::string("lifepo4");
          battery_capacity: !lambda 'return (uint16_t) id(battery_capacity_mah).state;'
          charge_current: !lambda 'return (uint16_t) id(default_charge_current).state;'
          # Both = 0, Charger Only = 1, Gauge Only = 2, None = 3: the charger input is ignored for 2 and 3.
          ts_ignore: !lambda 'return id(ts_enable).active_index().value_or(0) >= 2;'
      - bq34z100.configure_pack:
          id: fuel_gauge
          design_capacity: !lambda 'return (uint16_t) id(battery_capacity_mah).state;'
          design_energy: !lambda 'return (uint16_t) id(battery_energy_mwh).state;'
          lifepo4_relax: !lambda 'return id(cell_chemistry).active_index().value_or(0) == 0;'
          # The gauge reads its own thermistor for Both and Gauge Only.
          external_thermistor: !lambda 'return id(ts_enable).active_index().value_or(0) % 2 == 0;'

text_sensor:
  # A hash of the schema number and every setup value, kept internal. setup_battery stores it when the setup completes;
  # Setup Status compares the stored one with this one.
  - platform: template
    id: setup_key
    internal: true
    update_interval: 10s
    lambda: |-
      auto u = [](float v) { return std::isnan(v) ? 0u : (unsigned) v; };
      char buf[96];
      snprintf(buf, sizeof(buf), "%u|%u|%u|%u|%u|%u", (unsigned) ${setup_schema},
               (unsigned) id(cell_chemistry).active_index().value_or(0), u(id(battery_capacity_mah).state),
               u(id(battery_energy_mwh).state), u(id(default_charge_current).state),
               (unsigned) id(ts_enable).active_index().value_or(0));
      const uint32_t h = esphome::fnv1a_hash_extend(esphome::FNV1_OFFSET_BASIS, std::string(buf));
      snprintf(buf, sizeof(buf), "%08X", (unsigned) h);
      return std::string(buf);

  # unset: no setup recorded. complete: recorded for this firmware's setup and nothing changed since. outdated: this firmware
  # added setup items after the recorded setup. modified: the values were changed after the recorded setup.
  - platform: template
    id: setup_status
    name: "Setup Status"
    icon: "mdi:clipboard-check-outline"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 10s
    lambda: |-
      if (!id(setup_key).has_state()) return {};
      if (id(setup_hash_stored) == 0) return std::string("unset");
      if (id(setup_schema_stored) < ${setup_schema}) return std::string("outdated");
      char buf[12];
      snprintf(buf, sizeof(buf), "%08X", (unsigned) id(setup_hash_stored));
      return std::string(buf) == id(setup_key).state ? std::string("complete") : std::string("modified");

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Restart with Factory Default Settings"
    internal: true

# --- Cell settings, chosen by the owner after setup -----------------------------------------
# Template entities restored from flash. The defaults are the substitutions above.
select:
  - platform: template
    name: "Cell Chemistry"
    id: cell_chemistry
    icon: "mdi:battery-heart-variant"
    entity_category: config
    options: ["LiFePO4", "Li-ion"]
    initial_option: "LiFePO4"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: fill_energy
        - script.execute: apply_battery

  # Which thermistors are fitted: the charger's (J302) and the fuel gauge's (J401). "Both" is the
  # safe default and needs both fitted. Without the charger's thermistor the charger reads "too
  # cold" and never charges; "Gauge Only" and "None" tell it to ignore that input, which removes
  # its temperature protection (no cut-off when the cell is hot or frozen). Without the gauge's
  # thermistor the gauge reads about -40 C and reports "Charge inhibited"; "Charger Only" and
  # "None" make it use its own temperature sensor instead.
  - platform: template
    name: "TS Enable"
    id: ts_enable
    icon: "mdi:thermometer-check"
    entity_category: config
    options: ["Both", "Charger Only", "Gauge Only", "None"]
    initial_option: "Both"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_battery

number:
  - platform: template
    name: "Battery Capacity"
    id: battery_capacity_mah
    icon: "mdi:battery"
    entity_category: config
    unit_of_measurement: "mAh"
    mode: box
    min_value: 100
    max_value: 20000
    step: 50
    initial_value: ${battery_capacity}
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: fill_energy
        - script.execute: apply_battery

  # Filled in from the capacity and the chemistry whenever either changes (3.2 V per cell for
  # LiFePO4, 3.7 V for lithium-ion); edit it afterwards if the cell's datasheet says otherwise.
  # The gauge stores it in a signed 16-bit field, so 32767 mWh is the ceiling.
  - platform: template
    name: "Battery Energy"
    id: battery_energy_mwh
    icon: "mdi:battery-charging-high"
    entity_category: config
    unit_of_measurement: "mWh"
    mode: box
    min_value: 100
    max_value: 32767
    step: 10
    initial_value: ${battery_energy_mwh}
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_battery

  # The charge current applied at every boot. "Charge Current Limit" changes it live but is
  # forgotten at the next reset; this one is kept.
  - platform: template
    name: "Default Charge Current"
    id: default_charge_current
    icon: "mdi:current-dc"
    entity_category: config
    unit_of_measurement: "mA"
    mode: box
    min_value: 100
    max_value: 2000
    step: 50
    initial_value: ${charge_current}
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: apply_battery
