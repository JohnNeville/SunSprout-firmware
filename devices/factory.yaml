# Factory image: a SunSprout hub that carries no WiFi credentials.
#
# Flash this once and the board comes up in setup mode. The end user then gives it
# a network in any of four ways:
#
#   - from a browser over USB, through the Improv prompt on the ESP Web Tools page;
#   - from a phone over Bluetooth, with any Improv Bluetooth client: connect, then press
#     the BOOT button (SW2) within a minute to authorise the change;
#   - by joining the "Sunsprout Setup" access point and using the captive portal;
#   - by adopting it in the ESPHome dashboard, which writes a normal device file that
#     pulls this one in as a package and adds the secrets (see dashboard_import below).
#
# Setup stays open for five minutes after power-up. If nobody has provisioned the board
# by then the access point, the portal and both Improv transports close, and the status
# LED flashes fast. Cycle the power to open the window again.
#
# The status LED is ESPHome's own status_led: it pulses slowly while a component has a
# warning (the WiFi connecting, or no client such as Home Assistant connected yet), flashes
# fast on an error (the timeout above, a failed component) and is off the rest of the time. It is plain output state, so nothing is saved and nothing comes back at the
# next power-up. This image therefore has no "Status LED" light entity.
#
# Holding the BOOT button for ten seconds erases the saved settings, including any WiFi
# credentials given through Improv or the portal, and restarts the board in setup mode.
# The LED blinks fast for a second and a half before the restart.
#
# The cell is set after setup, not at build time (modules/setup.yaml): the Cell Chemistry, Battery Capacity,
# Battery Energy, Cell Charge Voltage, Default Charge Current and TS Enable entities (configuration category) are kept in
# flash and written to the charger and the fuel gauge at every boot. Until they are changed
# the board assumes a 6000 mAh LiFePO4 cell, which charges to 3.65 V and cannot overcharge
# a lithium-ion cell either. Choosing Li-ion raises the limit to 4.2 V. The charger also
# expects a thermistor on the TS pin and will not charge without one; TS Enable says which of
# the two thermistors (charger J302, gauge J401) are fitted, and a pack with none can charge at
# the cost of the temperature protection.
#
# It carries no API encryption key and no OTA password, because those belong to whoever
# owns the board: Home Assistant sets the key on first connection, or adopting it in the
# dashboard generates one. It does not include deep sleep, so an
# unconfigured board stays awake long enough to be set up.
#
# This image is the hub, common, wizard and setup packages plus modules/provisioning.yaml (the setup mode above). A device file that
# gives its own WiFi and API credentials can include modules/setup.yaml (and wizard.yaml) without provisioning.yaml and get the same cell
# settings and guided setup; see modules/setup.yaml.

substitutions:
  name: sunsprout
  friendly_name: Sunsprout

  # Set by the release workflow (`esphome -s firmware_version ...`) to YYYY.MM.DD.<build>. A build
  # made any other way, such as from the ESPHome dashboard, reports "dev".
  firmware_version: "dev"

  # The LiFePO4 defaults. A standard lithium-ion build changes these; see README.md.
  battery_capacity: "6000"
  battery_energy_mwh: "19200"

packages:
  hub: !include ../modules/hub.yaml
  common: !include ../modules/common.yaml
  # Home Assistant 2026.11 and later shows this setup wizard when the board is added; older versions ignore it.
  wizard: !include ../modules/wizard.yaml
  # The cell settings, the guided first-time setup and the recorded setup state.
  setup: !include ../modules/setup.yaml
  # The setup mode for a board with no credentials: Improv, the access point, the portal, the setup window, the status LED and the BOOT reset.
  provisioning: !include ../modules/provisioning.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  name_add_mac_suffix: true
  project:
    name: JohnNeville.SunSproutHub
    version: ${firmware_version}
    sbom:
      supplier: "John Neville"
      url: "https://github.com/JohnNeville/SunSprout-firmware/security/policy"

dashboard_import:
  package_import_url: github://JohnNeville/SunSprout-firmware/sunsprout-factory.yaml@main
  import_full_config: false

ota:
  - platform: esphome
