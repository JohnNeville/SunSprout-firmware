# A hub with two satellites: example-device.yaml plus one sunsprout-satellite.yaml per satellite.
#
# Satellite 2 has its address jumpers changed (ADS1115 0x4A, DS2482 0x1A) so both can share the bus.
# Replace the two voltages below with the readings of your own probes in air and in water.

substitutions:
  soil_dry_voltage: "2.43"
  soil_wet_voltage: "1.12"

packages:
  device: !include example-device.yaml
  sat1: !include
    file: sunsprout-satellite.yaml
    vars:
      id: sat1
      name: "Satellite 1"
      ads_address: 0x48
      ds_address: 0x18
  sat2: !include
    file: sunsprout-satellite.yaml
    vars:
      id: sat2
      name: "Satellite 2"
      ads_address: 0x4A
      ds_address: 0x1A
