# Settings every SunSprout hub device wants, whatever its networking looks like.
#
# Add it next to sunsprout-hub.yaml:
#
#   packages:
#     hub: !include sunsprout-hub.yaml
#     common: !include sunsprout-common.yaml
#
# It has no WiFi, API, OTA or deep-sleep configuration and no device name, so the
# same file serves the factory image and a fully customised device.

esphome:
  on_boot:
    # After the charger and gauge have set themselves up.
    - priority: 500
      then:
        - logger.log:
            format: "User 3V3 rail enabled."
            tag: setup

switch:
  # The rail is on at every boot, including after deep sleep, and comes on when the switch is
  # set up, before the user I2C bus (see sunsprout-hub.yaml). Turning it off from Home Assistant
  # saves power until the next boot. ALWAYS_ON rather than a restored state, because the
  # deep-sleep package turns the rail off before sleeping and a restored "off" would keep it off.
  - id: !extend user_rail
    restore_mode: ALWAYS_ON

# The board's UART0 pins are only test points; the USB-C port is the way to read logs.
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

time:
  - platform: homeassistant
    id: homeassistant_time

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
