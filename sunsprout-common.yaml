# Settings every SunSprout hub device wants, whatever its networking looks like.
#
# Add it next to sunsprout-hub.yaml:
#
#   packages:
#     hub: !include sunsprout-hub.yaml
#     common: !include sunsprout-common.yaml
#
# It has no WiFi, API, OTA or deep-sleep configuration and no device name, so the
# same file serves the factory image and a fully customised device.

esphome:
  on_boot:
    # Switch the user 3V3 rail on before the I2C buses are set up (priority 1000). Waking from deep
    # sleep, the rail has been off, so the user bus lines sit low through the pull-ups; a bus
    # initialised in that state left the ADS1115 and the 1-Wire bridge unreadable for the whole boot.
    # The chips on the rail answer about 14 ms after it comes on, so 50 ms is a comfortable wait.
    - priority: 1100
      then:
        - lambda: |-
            gpio_set_direction(GPIO_NUM_23, GPIO_MODE_OUTPUT);   // EN_3V3_USER
            gpio_set_level(GPIO_NUM_23, 1);
            delay(50);
    # After the charger and gauge have set themselves up.
    - priority: 500
      then:
        - logger.log:
            format: "User 3V3 rail enabled."
            tag: setup

switch:
  # The rail is on at every boot (the line above sets it early; this keeps the switch's own
  # setup from switching it off again). Turn it off from Home Assistant to save power; it
  # comes back on at the next boot, including after deep sleep.
  - id: !extend user_rail
    restore_mode: ALWAYS_ON

# The board's UART0 pins are only test points; the USB-C port is the way to read logs.
logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

time:
  - platform: homeassistant
    id: homeassistant_time

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
