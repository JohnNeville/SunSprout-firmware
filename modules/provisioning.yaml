# The setup mode for a board that ships with no WiFi or API credentials: the factory image's extras on top of hub.yaml, common.yaml and setup.yaml.
#
# Include it in a device file only when the board has no credentials in the file. A device file that gives its WiFi and API key (from secrets, with
# a static address, say) does not want any of this: leave this module out and use modules/setup.yaml for the cell settings and the guided setup.
#
# Flash it and the board comes up in setup mode. The end user then gives it a network in any of four ways:
#
#   - from a browser over USB, through the Improv prompt on the ESP Web Tools page;
#   - from a phone over Bluetooth, with any Improv Bluetooth client: connect, then press
#     the BOOT button (SW2) within a minute to authorise the change;
#   - by joining the "<friendly name> Setup" access point and using the captive portal;
#   - by adopting it in the ESPHome dashboard, which writes a normal device file that
#     pulls the factory image in as a package and adds the secrets.
#
# Setup stays open for five minutes after power-up. If nobody has provisioned the board by then the access point, the portal and both Improv
# transports close, and the status LED flashes fast. Cycle the power to open the window again.
#
# The status LED is ESPHome's own status_led: it pulses slowly while a component has a warning (the WiFi connecting, or no client such as Home
# Assistant connected yet), flashes fast on an error (the timeout above, a failed component) and is off the rest of the time. It is plain output
# state, so nothing is saved. This takes the pin from the hub's "Status LED" light, so there is no such light entity.
#
# Holding the BOOT button for ten seconds erases the saved settings, including any WiFi credentials given through Improv or the portal, and
# restarts the board in setup mode. The LED blinks fast for a second and a half before the restart.
#
# It carries no API encryption key and no OTA password, because those belong to whoever owns the board: Home Assistant sets the key on first
# connection, or adopting it in the dashboard generates one. It does not include deep sleep, so an unconfigured board stays awake long enough to be set up.

esphome:
  on_boot:
    # A board with no battery attached leaves the fuel gauge unpowered, so it never answers and
    # ESPHome marks it failed. A failed component raises the error flag, which makes the status
    # LED flash fast for good. A missing battery is a normal state for a factory image, so drop
    # that flag (the error stays in the log) and leave the LED to the provisioning signal.
    - priority: -200
      then:
        - lambda: |-
            if (id(fuel_gauge).is_failed()) {
              id(fuel_gauge).status_clear_error();
            }

# Encryption is on but has no key. The board starts without one and the first client to
# connect, normally Home Assistant, sets a random key over an encrypted channel; the board
# keeps it in flash. The key is only accepted while the five-minute setup window is open, so the
# client has to connect within that time of power-up. Until a key is set the API counts as
# unprovisioned, so a board that has WiFi but has never met Home Assistant will still reach the
# setup window timeout below. A board adopted in the ESPHome dashboard gets a key from the dashboard instead.
api:
  encryption:

# No ssid: the board starts its own access point until credentials are saved.
wifi:
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

improv_serial:

# Bluetooth setup for phones. The BOOT button authorises a change, so a stranger in
# range cannot set the network while the window is open.
esp32_ble:

improv_ble:
  authorizer: boot_button
  authorized_duration: 1min

# The window is counted from power-up and only runs while the board has no network. When
# it expires the transports above close; the LED is the only sign left. The warning below
# lives in RAM, so a power cycle clears it along with reopening the window.
provisioning:
  id: provisioning_window
  timeout: 5min
  on_timeout:
    then:
      - logger.log:
          level: WARN
          format: "Provisioning window timed out. Cycle the power to try again."
      # An error, not a warning: a slow pulse already means "online, waiting for a client".
      - lambda: 'id(provisioning_window).status_set_error();'

# GPIO6 drives the LED through R3. The hub package puts a "Status LED" light on the same pin;
# this image gives the pin to ESPHome's status LED instead.
status_led:
  pin: GPIO6

output:
  - id: !remove status_led_output

light:
  - id: !remove status_led

# SW2 pulls GPIO28 low and has a 10 kOhm pull-up on the board. GPIO28 is a boot-mode
# strapping pin, which only matters at reset: holding the button during power-up still
# enters the download mode, as it always has.
binary_sensor:
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO28
      mode:
        input: true
      inverted: true
      ignore_strapping_warning: true
    on_press:
      then:
        - script.execute: hold_to_reset
    on_release:
      then:
        - script.stop: hold_to_reset

script:
  - id: hold_to_reset
    mode: restart
    then:
      - delay: 10s
      - if:
          condition:
            binary_sensor.is_on: boot_button
          then:
            - logger.log:
                level: WARN
                format: "BOOT held for 10 s: erasing the saved settings."
            - lambda: 'id(provisioning_window).status_set_error();'
            - delay: 1500ms
            - button.press: factory_reset_button

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Restart with Factory Default Settings"
    internal: true
