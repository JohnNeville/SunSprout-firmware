# Debug additions for a SunSprout hub image. Include it next to the hub and common packages (or use
# devices/factory-debug.yaml, which is the factory image plus this). It adds:
#
#   - DEBUG logging;
#   - a "Scan I2C Buses" button and text sensors that list the addresses found on the internal and the
#     user bus, with a name for each address the firmware knows;
#   - a "Component Status" text sensor saying whether the charger and the fuel gauge started, refreshed
#     whenever the scan button is pressed;
#   - ESP32 diagnostics: free memory, largest free block, fragmentation, loop time, CPU frequency, chip
#     temperature, uptime, reset reason, device info, and the WiFi address and access point;
#   - Restart and Restart in Safe Mode buttons;
#   - the charger's register check, with a "Register Check" select (Off, Watch or Enforce; Watch logs and counts
#     differences, Enforce also writes drifted settings back, which is not recommended) and "Register Corrections"
#     and "Last Register Correction" entities. Corrections counts the 5 s checks that found a difference, so a
#     difference that lasts counts every time. The choice is kept across reboots; the debug_register_check
#     substitution ("Off", "Watch" or "Enforce") is the first-boot value.
#   - the fuel gauge's learning progress ("Gauge Qmax", "Gauge Update Status", "Gauge Learning Status", refreshed every
#     5 minutes, which unseals the gauge briefly each time), its offset calibration and Enable Impedance Track buttons
#     switched on, and a "Dump Gauge Data Flash" button that logs the gauge's data flash.
#
# All of it is in the diagnostic category. It is for bench work: it costs flash, RAM and a little
# current, so do not ship it. The user bus has no power until the rail is on, so scan it after boot.

substitutions:
  debug_register_check: "Watch"   # Off, Watch or Enforce

logger:
  level: DEBUG

bq25798:
  # Starts the check's timer; the select below changes the mode, or stops the timer, once the board is up.
  register_check: watch
  register_corrections:
    name: "Register Corrections"
    entity_category: diagnostic
  # The same count without EN_MPPT and EN_HIZ, which the charger flips by itself at dawn and dusk.
  unexpected_corrections:
    name: "Unexpected Register Corrections"
    entity_category: diagnostic
  last_correction:
    name: "Last Register Correction"
    entity_category: diagnostic

debug:
  update_interval: 30s

select:
  - platform: template
    name: "Register Check"
    id: register_check_select
    icon: "mdi:shield-search"
    entity_category: diagnostic
    options: ["Off", "Watch", "Enforce"]
    initial_option: "${debug_register_check}"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: !lambda |-
          id(charger).set_register_check(x == "Enforce" ? 2 : (x == "Watch" ? 1 : 0));

esphome:
  on_boot:
    # After the charger has set up and the select has restored its value, so a saved "Off" stops the timer.
    - priority: 100
      then:
        - lambda: |-
            auto i = id(register_check_select).active_index();
            id(charger).set_register_check(i.has_value() && *i == 2 ? 2 : (i.has_value() && *i == 0 ? 0 : 1));

button:
  - platform: template
    name: "Scan I2C Buses"
    id: i2c_scan_button
    icon: "mdi:magnify-scan"
    entity_category: diagnostic
    on_press:
      - script.execute: i2c_scan
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
  - platform: safe_mode
    name: "Restart in Safe Mode"
    entity_category: diagnostic

script:
  - id: i2c_scan
    mode: single
    then:
      - lambda: |-
          // A name for each address a SunSprout board is known to use.
          auto name = [](uint8_t a) -> const char * {
            if (a == 0x6B) return "BQ25798 charger";
            if (a == 0x55) return "BQ34Z100 gauge";
            if (a >= 0x18 && a <= 0x1B) return "DS2482 1-Wire";
            if (a == 0x4A) return "ADS1115 or SEN0390";
            if (a >= 0x48 && a <= 0x4B) return "ADS1115";
            return nullptr;
          };
          auto scan = [&](i2c::I2CBus *bus, const char *label, text_sensor::TextSensor *list, sensor::Sensor *count) {
            std::string found;
            int n = 0;
            for (uint8_t a = 0x08; a < 0x78; a++) {
              if (bus->write_readv(a, nullptr, 0, nullptr, 0) != i2c::ERROR_OK)
                continue;
              char b[48];
              if (name(a))
                snprintf(b, sizeof(b), "%s0x%02X %s", n ? ", " : "", a, name(a));
              else
                snprintf(b, sizeof(b), "%s0x%02X", n ? ", " : "", a);
              found += b;
              n++;
            }
            if (found.size() > 250) found.resize(250);
            ESP_LOGW("i2cscan", "%s: %d device(s): %s", label, n, n ? found.c_str() : "none");
            list->publish_state(n ? found : std::string("none"));
            count->publish_state(n);
          };
          scan(id(bus_internal), "internal bus", id(i2c_internal_found), id(i2c_internal_count));
          scan(id(bus_user), "user bus", id(i2c_user_found), id(i2c_user_count));
          std::string s = std::string("charger ") + (id(charger).is_failed() ? "FAILED" : "ok") + ", gauge " +
                          (id(fuel_gauge).is_failed() ? "FAILED" : "ok");
          id(component_status).publish_state(s);

text_sensor:
  - platform: template
    name: "I2C Internal Bus Devices"
    id: i2c_internal_found
    icon: "mdi:chip"
    entity_category: diagnostic
  - platform: template
    name: "I2C User Bus Devices"
    id: i2c_user_found
    icon: "mdi:chip"
    entity_category: diagnostic
  - platform: template
    name: "Component Status"
    id: component_status
    icon: "mdi:heart-pulse"
    entity_category: diagnostic
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    bssid:
      name: "Connected BSSID"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

sensor:
  # The hub package leaves the gauge's calibration buttons off in Home Assistant; the first-time setup needs them.
  - id: !extend fuel_gauge
    qmax:
      name: "Gauge Qmax"
    update_status:
      name: "Gauge Update Status"
    learning_status:
      name: "Gauge Learning Status"
    cc_offset_calibration:
      disabled_by_default: false
    board_offset_calibration:
      disabled_by_default: false
    enable_impedance_track:
      disabled_by_default: false
    dump_data_flash:
      name: "Dump Gauge Data Flash"

  - platform: template
    name: "I2C Internal Bus Device Count"
    id: i2c_internal_count
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "I2C User Bus Device Count"
    id: i2c_user_count
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: internal_temperature
    name: "Chip Temperature"
    entity_category: diagnostic
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic
    block:
      name: "Heap Largest Block"
      entity_category: diagnostic
    fragmentation:
      name: "Heap Fragmentation"
      entity_category: diagnostic
    loop_time:
      name: "Loop Time"
      entity_category: diagnostic
    cpu_frequency:
      name: "CPU Frequency"
      entity_category: diagnostic
