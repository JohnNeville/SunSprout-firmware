    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 30s
  - platform: copy
    source_id: ${id}_moisture4_voltage
    name: "Soil Moisture 4"
    id: ${id}_moisture4
    device_id: ${id}
    unit_of_measurement: "%"
