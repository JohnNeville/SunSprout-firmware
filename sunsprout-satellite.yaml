      # No probe on the input (or a broken lead): well outside the probe's range, so unavailable.
      - lambda: |-
          if (x < ${soil_wet_voltage} - 0.3f || x > ${soil_dry_voltage} + 0.5f) return NAN;
          return x;
      - calibrate_linear:
          - ${soil_dry_voltage} -> 0
